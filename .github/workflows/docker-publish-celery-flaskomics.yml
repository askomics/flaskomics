name: Publish Flaskomics Docker image to Dockerhub

on:
  push:
    branches:
      - 'master'
      - 'dev'
    tags:
      - '*.*.*'

env:
  REGISTRY: registry.hub.docker.com
  IMAGE_NAME: flaskomics

jobs:
  build-and-push-image:
    if: github.repository == 'askomics/flaskomics'
    environment: docker-registry
    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v3

      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v3
        with:
          # list of Docker images to use as base name for tags
          images: registry.hub.docker.com/askomics/flaskomics
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      -
        name: Login to registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: mboudet
          password: ${{ secrets.DOCKER_TOKEN }}

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      -
        name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./docker/DockerfileCelery
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
